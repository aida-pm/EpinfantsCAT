---
layout: default
---

<article class="plot-detail" style="max-width: 900px; margin: 0 auto; padding: 2rem 1rem;">
  <a href="{{ '/' | relative_url }}" style="display:inline-block; margin-bottom: 1.5rem;">&larr; Back to all figures</a>

  <h1>{{ page.title }}</h1>
  <p style="color: #777; font-size: 0.9rem;">Updated {{ page.date | date: "%d %B %Y" }}</p>

  <img src="{{ page.image | relative_url }}" alt="{{ page.title }}"
       style="width: 100%; height: auto; border-radius: 6px; margin: 1.5rem 0;">

  <p>{{ page.description }}</p>
</article>
